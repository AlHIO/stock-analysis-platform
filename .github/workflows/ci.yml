name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --require-hashes -r apps/api/requirements.lock
      - run: python -m pip install --no-deps -e './apps/api[test]'
      - run: python -m pytest apps/api/tests -m 'not integration and not network'
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 300
      - run: docker compose run --rm backend alembic upgrade head
      - run: docker compose run --rm backend alembic check
      - run: docker compose run --rm -e RUN_INTEGRATION=1 backend python -m pytest -m integration
      - run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/health/ready
          curl --fail http://localhost:3000 | grep '股票分析平台'
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
