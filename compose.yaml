name: stockapp
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-stockapp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockapp}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/${POSTGRES_DB:-stockapp}
      REDIS_URL: redis://redis:6379/0
      INGESTION_MIN_INTERVAL_SECONDS: ${INGESTION_MIN_INTERVAL_SECONDS:-5}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
      INGESTION_MAX_RESPONSE_BYTES: ${INGESTION_MAX_RESPONSE_BYTES:-20000000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  history-worker:
    profiles: [history]
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockapp}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/${POSTGRES_DB:-stockapp}
      INGESTION_MIN_INTERVAL_SECONDS: ${INGESTION_MIN_INTERVAL_SECONDS:-5}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
      INGESTION_MAX_RESPONSE_BYTES: ${INGESTION_MAX_RESPONSE_BYTES:-20000000}
    command: ["stockapp", "history", "queue", "--jobs", "${HISTORY_JOB_IDS:-${HISTORY_JOB_ID:-00000000-0000-0000-0000-000000000000}}"]
    stop_signal: SIGINT
    stop_grace_period: 5m
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  daily-worker:
    profiles: [daily]
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockapp}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/${POSTGRES_DB:-stockapp}
      INGESTION_MIN_INTERVAL_SECONDS: ${INGESTION_MIN_INTERVAL_SECONDS:-5}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
      INGESTION_MAX_RESPONSE_BYTES: ${INGESTION_MAX_RESPONSE_BYTES:-20000000}
      DAILY_SYNC_INSTITUTIONAL_EVIDENCE: ${DAILY_SYNC_INSTITUTIONAL_EVIDENCE:-}
      DAILY_SYNC_OWNERSHIP_EVIDENCE: ${DAILY_SYNC_OWNERSHIP_EVIDENCE:-}
      DAILY_SYNC_MARGIN_EVIDENCE: ${DAILY_SYNC_MARGIN_EVIDENCE:-}
      DAILY_SYNC_LENDING_EVIDENCE: ${DAILY_SYNC_LENDING_EVIDENCE:-}
    command: ["stockapp", "daily", "worker", "--at", "${DAILY_SYNC_AT:-20:00}"]
    volumes:
      - ${DAILY_SYNC_EVIDENCE_DIR:-./.tools/daily-evidence}:/evidence:ro
    stop_signal: SIGTERM
    stop_grace_period: 65m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "stockapp", "daily", "status", "--limit", "1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
